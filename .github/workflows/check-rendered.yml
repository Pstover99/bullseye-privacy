name: Check rendered page

# Every .html page is generated by render.py from _layout.html, _pages/ and PRIVACY_POLICY.md,
# and must never be hand-edited. This job fails if a page has drifted from its source, or if
# the copy uses a British spelling (docs/COPY_STYLE.md rule 10).
#
# It verifies rather than regenerating-and-committing on purpose. This page is linked from
# the Play listing, so a workflow with write access to it is a bigger risk than the drift
# it would prevent; and a red check is a clearer instruction than a surprise commit.
#
# If this fails: edit the source (not the .html), run `python3 render.py` and commit both.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every page matches its source and uses US spelling
        run: python3 render.py --check
