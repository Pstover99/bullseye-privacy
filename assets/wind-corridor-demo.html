<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Wind Corridor Demo</title>
<meta name="robots" content="noindex">
<style>
/* Barlow is self-hosted (assets/fonts, OFL-Barlow.txt) so the demo makes no third-party request. */
@font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url("fonts/barlow-400.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url("fonts/barlow-500.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url("fonts/barlow-600.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 500; font-display: swap; src: url("fonts/barlow-condensed-500.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url("fonts/barlow-condensed-600.woff2") format("woff2"); }
/* Layout: one full-height phone stage. Firing line at the bottom, target at the top, screen edges are the corridor edges. On wide screens the stage becomes a phone-proportioned frame. */
:root {
  --ground: #0A1016;
  --frame: #04070A;
  --ink: #E8EEF2;
  --ink-2: #B8C6D1;
  --muted: #9AA7B2;
  --amber: #F2A541;
  --live: #5CC98A;
  --panel: rgba(10, 16, 22, 0.84);
  --sheet: #111A22;
  --hair: rgba(232, 238, 242, 0.22);
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: Barlow, 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--frame); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
@media (min-width: 560px) {
  #stage { height: min(calc(100% - 32px), 900px); width: auto; max-width: 100%; aspect-ratio: 390 / 844; border-radius: 40px; border: 1px solid rgba(232, 238, 242, 0.12); }
}
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { position: absolute; inset: 0; pointer-events: none; }
.abs { position: absolute; }
.hline { position: absolute; left: 0; right: 0; height: 1px; }
.tick-line { left: 36px; background: rgba(184, 198, 209, 0.07); }
.tick { left: 8px; width: 28px; font-family: var(--display); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: rgba(184, 198, 209, 0.62); font-variant-numeric: tabular-nums; }
.band { left: 0; right: 0; border-top: 1px dashed rgba(154, 167, 178, 0.45); border-bottom: 1px dashed rgba(154, 167, 178, 0.45); background: repeating-linear-gradient(135deg, rgba(154, 167, 178, 0.10) 0 2px, transparent 2px 11px); }
.band-cap { right: 10px; padding: 3px 7px; border-radius: 4px; background: var(--panel); font-family: var(--display); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #A7B3BD; }
.target { left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.target-label { font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: 0.14em; }
.row { left: 0; right: 0; height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr); column-gap: 10px; align-items: center; }
.tag { justify-self: end; padding: 4px 8px; border-radius: 6px; background: var(--panel); font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: 0.08em; color: var(--amber); font-variant-numeric: tabular-nums; }
.badge { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--amber); background: rgba(10, 16, 22, 0.88); display: flex; align-items: center; justify-content: center; }
.badge svg { transition: transform 0.6s ease; }
.reading { justify-self: start; padding: 4px 9px 5px; border-radius: 6px; background: var(--panel); display: flex; flex-direction: column; gap: 1px; }
.speed-line { display: flex; align-items: baseline; gap: 4px; }
.speed { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1; color: #FFFFFF; font-variant-numeric: tabular-nums; }
.unit, .clock { font-size: 12px; color: var(--ink-2); }
.row.stale .tag { color: var(--muted); }
.row.stale .badge { border: 2px dashed #8A97A3; }
.nosig { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: 0.06em; color: #C9D3DB; }
.nodata { left: 50px; right: 50px; padding: 14px 16px; border-radius: 10px; background: rgba(10, 16, 22, 0.92); border: 1px solid rgba(154, 167, 178, 0.4); text-align: center; }
.caption { left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; letter-spacing: 0.04em; color: #8E9BA6; }

#bar { position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bar-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bar-title { font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: 0.14em; }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.pill, .icon-btn { height: 44px; border-radius: 22px; border: 1px solid rgba(232, 238, 242, 0.28); background: var(--panel); color: var(--ink); font-family: var(--body); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; cursor: pointer; }
.pill { padding: 0 12px 0 14px; }
.icon-btn { width: 44px; justify-content: center; padding: 0; }
.pill:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, #sheet input:focus-visible, .close:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

#sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 22px; background: var(--sheet); border-top: 1px solid var(--hair); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.45); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.close { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px; }
legend, .field label { padding: 0; margin-bottom: 8px; font-family: var(--display); font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; gap: 6px; }
.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg button { min-height: 44px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--hair); background: transparent; color: var(--ink-2); font-family: var(--body); font-size: 14px; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--amber); background: rgba(242, 165, 65, 0.14); color: var(--ink); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.field label { margin: 0; }
output { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--amber); height: 32px; margin: -8px 0 0; }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--amber); margin: 0; }
.note { margin: 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="field" role="img" aria-label="Animated wind particles flowing through the corridor between the firing line and the target"></canvas>
    <div id="overlay"></div>
    <div id="bar">
      <div class="bar-left">
        <div class="bar-title">FIRING LINE</div>
        <div class="live"><span class="dot"></span><span id="live-text">3 of 3 sensors live</span></div>
      </div>
      <div class="bar-right">
        <button type="button" class="pill" id="scen-btn" aria-label="Next demo scenario">
          <span id="scen-name">Switching wind</span>
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2.5 L9.5 7 L5 11.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <button type="button" class="icon-btn" id="settings-btn" aria-label="Demo settings" aria-expanded="false" aria-controls="sheet">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5 H17 M3 10 H17 M3 14.5 H17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path><circle cx="7" cy="5.5" r="2" fill="#111A22" stroke="currentColor" stroke-width="1.7"></circle><circle cx="13" cy="10" r="2" fill="#111A22" stroke="currentColor" stroke-width="1.7"></circle><circle cx="8.5" cy="14.5" r="2" fill="#111A22" stroke="currentColor" stroke-width="1.7"></circle></svg>
        </button>
      </div>
    </div>
    <div class="abs caption">Demo data · width not to scale · wind direction is true</div>

    <div id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden>
      <div class="sheet-head">
        <h2 id="sheet-title">Demo settings</h2>
        <button type="button" class="close" id="close-btn" aria-label="Close settings">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4 L14 14 M14 4 L4 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
        </button>
      </div>
      <fieldset>
        <legend>Scenario</legend>
        <div class="seg two" id="seg-scen">
          <button type="button" data-v="0" aria-pressed="false">Steady push</button>
          <button type="button" data-v="1" aria-pressed="true">Switching wind</button>
          <button type="button" data-v="2" aria-pressed="false">Quartering head</button>
          <button type="button" data-v="3" aria-pressed="false">Sensor dropout</button>
        </div>
      </fieldset>
      <fieldset>
        <legend>Look</legend>
        <div class="seg three" id="seg-look">
          <button type="button" data-v="trails" aria-pressed="true">Trails</button>
          <button type="button" data-v="fog" aria-pressed="false">Fog</button>
          <button type="button" data-v="streaks" aria-pressed="false">Streaks</button>
        </div>
      </fieldset>
      <div>
        <div class="field"><label for="density">Particle density</label><output id="density-out" for="density">100%</output></div>
        <input type="range" id="density" min="0.4" max="1.6" step="0.1" value="1">
      </div>
      <div class="field"><label for="swirl">Gust swirl</label><input type="checkbox" id="swirl" checked></div>
      <p class="note">Sensor readings are simulated for this demo.</p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var GROUND = '#0A1016';
  var ICE = '207,232,245';
  var GREY = '138,151,163';
  var ROWS = 256;

  var SC = [
    { name: 'Steady push', D: 1024, gust: 0.14, sensors: [
      { dist: 300, speed: 7, from: 82, swing: 6 },
      { dist: 600, speed: 9, from: 92, swing: 6 },
      { dist: 900, speed: 11, from: 100, swing: 6 } ] },
    { name: 'Switching wind', D: 1024, gust: 0.2, sensors: [
      { dist: 0, speed: 6, from: 268, swing: 10 },
      { dist: 500, speed: 2.5, from: 350, swing: 40 },
      { dist: 900, speed: 8, from: 85, swing: 10 } ] },
    { name: 'Quartering head', D: 1024, gust: 0.24, sensors: [
      { dist: 250, speed: 10, from: 38, swing: 8 },
      { dist: 650, speed: 12, from: 50, swing: 8 },
      { dist: 950, speed: 9, from: 32, swing: 8 } ] },
    { name: 'Sensor dropout', D: 1024, gust: 0.15, sensors: [
      { dist: 0, speed: 8, from: 100, swing: 6 },
      { dist: 450, speed: 10, from: 112, swing: 6 },
      { dist: 900, speed: 13, from: 95, swing: 6, drop: [6, 14, 20] } ] }
  ];
  SC.forEach(function (sc, a) {
    sc.sensors.forEach(function (s, b) {
      var seed = a * 7.31 + b * 3.17;
      s.p1 = seed * 1.7; s.p2 = seed * 2.9 + 1; s.p3 = seed * 0.6 + 2; s.p4 = seed * 4.3 + 3;
    });
  });

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var st = { scen: 1, look: 'trails', density: 1, swirl: !reduced };
  try {
    var saved = JSON.parse(localStorage.getItem('windCorridorDemo.v1') || 'null');
    if (saved) {
      if (saved.scen >= 0 && saved.scen < SC.length) st.scen = saved.scen;
      if (['trails', 'fog', 'streaks'].indexOf(saved.look) >= 0) st.look = saved.look;
      if (typeof saved.density === 'number') st.density = Math.min(1.6, Math.max(0.4, saved.density));
      if (typeof saved.swirl === 'boolean') st.swirl = saved.swirl;
    }
  } catch (e) { /* storage unavailable */ }
  function save() { try { localStorage.setItem('windCorridorDemo.v1', JSON.stringify(st)); } catch (e) { /* ignore */ } }

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var liveText = document.getElementById('live-text');
  var scenName = document.getElementById('scen-name');

  var W = 390, H = 844, TOP = 104, BOT = 752, K = 7.2;
  var t0 = performance.now();
  var cur = [], valid = [];
  var tgtU = new Float32Array(ROWS), tgtV = new Float32Array(ROWS);
  var dispU = new Float32Array(ROWS), dispV = new Float32Array(ROWS);
  var cls = new Uint8Array(ROWS);
  var fieldReady = false;
  var n = 0, px, py, age, life;
  var particleKey = '';
  var spriteIce = null, spriteGrey = null;
  var bk = []; for (var b = 0; b < 12; b++) bk.push([]);

  // ---------- simulated sensors ----------
  function sample(sc, s, t) {
    var g = sc.gust;
    var sp = s.speed * (1 + g * (0.6 * Math.sin(0.9 * t + s.p1) + 0.4 * Math.sin(2.3 * t + s.p2)));
    var from = s.from + (s.swing || 0) * Math.sin(0.23 * t + s.p3) + g * 14 * Math.sin(1.7 * t + s.p4);
    return { speed: Math.max(0, sp), from: from };
  }

  function tickReadings() {
    var t = (performance.now() - t0) / 1000;
    var sc = SC[st.scen];
    cur = sc.sensors.map(function (s) {
      var r = sample(sc, s, t);
      var stale = false, staleFor = 0;
      if (s.drop) {
        var ph = t % s.drop[2];
        if (ph >= s.drop[0] && ph < s.drop[1]) { stale = true; staleFor = ph - s.drop[0]; }
      }
      return { dist: s.dist, speed: r.speed, from: r.from, stale: stale, staleFor: staleFor };
    });
    buildField(sc);
  }

  // ---------- wind field: PCHIP on each component, endpoint hold ----------
  function sgn(v) { return v > 0 ? 1 : (v < 0 ? -1 : 0); }
  function edge(h0, h1, m0, m1) {
    var s = ((2 * h0 + h1) * m0 - h0 * m1) / (h0 + h1);
    if (sgn(s) !== sgn(m0)) return 0;
    if (sgn(m0) !== sgn(m1) && Math.abs(s) > 3 * Math.abs(m0)) return 3 * m0;
    return s;
  }
  function pchipD(x, y) {
    var nn = x.length, h = [], m = [], d = [], k;
    for (k = 0; k < nn - 1; k++) { h.push(x[k + 1] - x[k]); m.push((y[k + 1] - y[k]) / h[k]); }
    for (k = 0; k < nn; k++) d.push(0);
    if (nn === 2) { d[0] = m[0]; d[1] = m[0]; return d; }
    for (k = 1; k < nn - 1; k++) {
      if (m[k - 1] * m[k] > 0) {
        var w1 = 2 * h[k] + h[k - 1], w2 = h[k] + 2 * h[k - 1];
        d[k] = (w1 + w2) / (w1 / m[k - 1] + w2 / m[k]);
      }
    }
    d[0] = edge(h[0], h[1], m[0], m[1]);
    d[nn - 1] = edge(h[nn - 2], h[nn - 3], m[nn - 2], m[nn - 3]);
    return d;
  }
  function pchipE(x, y, d, q) {
    var nn = x.length;
    if (q <= x[0]) return y[0];
    if (q >= x[nn - 1]) return y[nn - 1];
    var k = 0;
    while (k < nn - 2 && q > x[k + 1]) k++;
    var h = x[k + 1] - x[k], t = (q - x[k]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * y[k] + (t3 - 2 * t2 + t) * h * d[k] + (-2 * t3 + 3 * t2) * y[k + 1] + (t3 - t2) * h * d[k + 1];
  }
  function buildField(sc) {
    var D = sc.D, r;
    valid = cur.filter(function (s) { return !s.stale; }).sort(function (a, b) { return a.dist - b.dist; });
    if (!valid.length) {
      for (r = 0; r < ROWS; r++) { tgtU[r] = 0; tgtV[r] = 0; cls[r] = 2; }
      return;
    }
    var xs = valid.map(function (s) { return s.dist; });
    var us = valid.map(function (s) { return s.speed * Math.cos((s.from + 180) * Math.PI / 180); });
    var vs = valid.map(function (s) { return s.speed * Math.sin((s.from + 180) * Math.PI / 180); });
    var multi = valid.length >= 2;
    var du = multi ? pchipD(xs, us) : null, dv = multi ? pchipD(xs, vs) : null;
    for (r = 0; r < ROWS; r++) {
      var x = r / (ROWS - 1) * D;
      if (!multi) { tgtU[r] = us[0]; tgtV[r] = vs[0]; cls[r] = 1; continue; }
      tgtU[r] = pchipE(xs, us, du, x);
      tgtV[r] = pchipE(xs, vs, dv, x);
      cls[r] = (x < xs[0] || x > xs[xs.length - 1]) ? 1 : 0;
    }
    if (!fieldReady) { dispU.set(tgtU); dispV.set(tgtV); fieldReady = true; }
  }

  // ---------- overlay ----------
  function clockLabel(from) {
    var h = (((from % 360) + 360) % 360) / 30;
    h = Math.round(h * 2) / 2;
    if (h >= 12) h -= 12;
    var hh = Math.floor(h), half = h - hh > 0;
    if (hh === 0) hh = 12;
    return half ? 'from ' + hh + ':30' : 'from ' + hh + ' o’clock';
  }
  function yd(d) { return (d === 0 ? '0' : d.toLocaleString('en-US')) + ' YD'; }

  var ARROW = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(ROTdeg)"><path d="M12 20 L12 4 M5.5 10.5 L12 4 L18.5 10.5" fill="none" stroke="#F2A541" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  var NOSIG = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 A11 11 0 0 1 20 9 M7.5 12.5 A6.5 6.5 0 0 1 16.5 12.5 M3 3 L21 21" fill="none" stroke="#9AA7B2" stroke-width="2" stroke-linecap="round"></path><circle cx="12" cy="17" r="1.6" fill="#9AA7B2"></circle></svg>';
  var WIND = '<svg width="15" height="12" viewBox="0 0 15 12" aria-hidden="true" style="align-self: center"><path d="M1 3.5 H9.5 A2.2 2.2 0 1 0 7.3 1.3 M1 6.5 H12 A2.2 2.2 0 1 1 9.8 8.7 M1 9.5 H6" fill="none" stroke="#B8C6D1" stroke-width="1.3" stroke-linecap="round"></path></svg>';
  var TARGET = '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#E8EEF2" stroke-width="1.5"></circle><circle cx="15" cy="15" r="8" fill="none" stroke="#E8EEF2" stroke-width="1.5"></circle><circle cx="15" cy="15" r="3" fill="#F2A541"></circle></svg>';
  var SHOOTER = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 15 L11 6 L19 15" fill="none" stroke="#E8EEF2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';

  function renderOverlay() {
    var sc = SC[st.scen], D = sc.D, span = BOT - TOP;
    function yOf(d) { return BOT - d / D * span; }
    var html = [];
    for (var d = 100; d < D - 60; d += 100) {
      var ty = Math.round(yOf(d));
      if (cur.some(function (s) { return Math.abs(yOf(s.dist) - ty) < 18; })) continue;
      html.push('<div class="hline tick-line" style="top:' + ty + 'px"></div><div class="abs tick" style="top:' + (ty - 7) + 'px">' + d + '</div>');
    }
    if (valid.length === 1 && valid[0].dist > 0) {
      html.push('<div class="abs band" style="top:' + TOP + 'px;height:' + span + 'px"></div><div class="abs band-cap" style="top:' + (TOP + 10) + 'px">Assumed full path · one reading</div>');
    } else if (valid.length >= 2) {
      var lo = valid[0].dist, hi = valid[valid.length - 1].dist;
      if (lo > 0) {
        var yt = yOf(lo);
        html.push('<div class="abs band" style="top:' + Math.round(yt) + 'px;height:' + Math.round(BOT - yt) + 'px"></div><div class="abs band-cap" style="top:' + Math.round((yt + BOT) / 2 + 14) + 'px">Assumed · held from ' + yd(lo).toLowerCase() + '</div>');
      }
      if (hi < D) {
        var yb = yOf(hi);
        html.push('<div class="abs band" style="top:' + (TOP + 1) + 'px;height:' + Math.round(yb - TOP - 1) + 'px"></div><div class="abs band-cap" style="top:' + Math.round((TOP + yb) / 2 - 22) + 'px">Assumed · held from ' + yd(hi).toLowerCase() + '</div>');
      }
    }
    html.push('<div class="hline" style="top:' + (TOP - 1) + 'px;background:rgba(232,238,242,0.55)"></div>');
    html.push('<div class="abs target" style="top:' + (TOP - 70) + 'px">' + TARGET + '<div class="target-label">TARGET · ' + D.toLocaleString('en-US') + ' YD</div></div>');
    cur.forEach(function (s) {
      var y = Math.round(yOf(s.dist));
      if (!s.stale) {
        var theta = ((((s.from + 180) % 360) + 360) % 360).toFixed(0);
        html.push('<div class="hline" style="top:' + y + 'px;background:rgba(242,165,65,0.32)"></div>' +
          '<div class="abs row" style="top:' + (y - 24) + 'px"><div class="tag">' + yd(s.dist) + '</div>' +
          '<div class="badge">' + ARROW.replace('ROT', theta) + '</div>' +
          '<div class="reading"><div class="speed-line">' + WIND + '<span class="speed">' + s.speed.toFixed(1) + '</span><span class="unit">mph</span></div>' +
          '<div class="clock">' + clockLabel(s.from) + '</div></div></div>');
      } else {
        html.push('<div class="hline" style="top:' + y + 'px;background:rgba(154,167,178,0.3)"></div>' +
          '<div class="abs row stale" style="top:' + (y - 24) + 'px"><div class="tag">' + yd(s.dist) + '</div>' +
          '<div class="badge">' + NOSIG + '</div>' +
          '<div class="reading"><span class="nosig">NO SIGNAL</span><span class="clock">Excluded · ' + Math.max(1, Math.round(s.staleFor)) + ' s</span></div></div>');
      }
    });
    if (!valid.length) {
      html.push('<div class="abs nodata" style="top:' + Math.round((TOP + BOT) / 2 - 30) + 'px"><div class="target-label">NO LIVE WIND DATA</div><div class="clock" style="margin-top:4px">Waiting for a sensor reading</div></div>');
    }
    html.push('<div class="hline" style="top:' + BOT + 'px;height:2px;background:rgba(232,238,242,0.7)"></div>');
    if (!cur.some(function (s) { return Math.abs(yOf(s.dist) - BOT) < 30; })) {
      html.push('<div class="abs" style="left:50%;margin-left:-11px;top:' + (BOT - 10) + 'px;width:22px;height:22px">' + SHOOTER + '</div>');
    }
    overlay.innerHTML = html.join('');
    liveText.textContent = valid.length + ' of ' + cur.length + ' sensors live';
    scenName.textContent = sc.name;
  }

  // ---------- particles ----------
  function makeSprite(rgb) {
    var c = document.createElement('canvas'); c.width = 64; c.height = 64;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(' + rgb + ',1)');
    grad.addColorStop(0.4, 'rgba(' + rgb + ',0.45)');
    grad.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    return c;
  }
  function spawn(i) {
    px[i] = Math.random() * W; py[i] = Math.random() * H;
    age[i] = 0; life[i] = 2.5 + Math.random() * 4.5;
  }
  function resetParticles() {
    var base = st.look === 'fog' ? 420 : (st.look === 'streaks' ? 1500 : 1300);
    n = Math.max(60, Math.round(base * st.density * (W * H) / (390 * 844)));
    px = new Float32Array(n); py = new Float32Array(n); age = new Float32Array(n); life = new Float32Array(n);
    for (var i = 0; i < n; i++) { spawn(i); age[i] = Math.random() * life[i]; }
    if (st.look === 'fog' && !spriteIce) { spriteIce = makeSprite('190,224,242'); spriteGrey = makeSprite(GREY); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, W, H);
  }

  function layout() {
    var r = stage.getBoundingClientRect();
    W = Math.max(200, r.width); H = Math.max(400, r.height);
    TOP = Math.round(Math.max(92, H * 0.118));
    BOT = Math.round(H - 108);
    K = 7.2 * (H / 844);
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    particleKey = '';
    renderOverlay();
  }

  var lastTs = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = lastTs ? (ts - lastTs) / 1000 : 0; lastTs = ts;
    if (dt <= 0) return;
    if (dt > 0.05) dt = 0.05;
    var key = st.look + ':' + st.density + ':' + W + 'x' + H;
    if (key !== particleKey) { particleKey = key; resetParticles(); }
    var a = 1 - Math.exp(-dt / 0.5), r, i;
    for (r = 0; r < ROWS; r++) { dispU[r] += (tgtU[r] - dispU[r]) * a; dispV[r] += (tgtV[r] - dispV[r]) * a; }
    var g = st.swirl ? SC[st.scen].gust : 0;
    var tt = ts / 1000, span = BOT - TOP, look = st.look;
    var fade = look === 'streaks' ? 1 : (look === 'fog' ? 0.06 : 0.085);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = fade >= 1 ? GROUND : 'rgba(10,16,22,' + fade + ')';
    ctx.fillRect(0, 0, W, H);
    for (var q = 0; q < 12; q++) bk[q].length = 0;
    for (i = 0; i < n; i++) {
      var x = px[i], y = py[i];
      var fr = (BOT - y) / span; if (fr < 0) fr = 0; if (fr > 1) fr = 1;
      r = Math.round(fr * (ROWS - 1));
      var u = dispU[r], v = dispV[r], sp = Math.sqrt(u * u + v * v);
      var vx = v * K, vy = -u * K;
      var amp = g * 0.9 * sp * K;
      if (amp > 0.01) {
        var c1 = Math.cos(0.021 * x + 0.013 * y + 0.9 * tt);
        var c2 = Math.cos(-0.011 * x + 0.024 * y + 1.3 * tt + 2.1);
        var c3 = Math.cos(0.006 * x - 0.009 * y + 0.5 * tt + 4.2);
        vx += amp * (0.263 * c1 + 0.273 * c2 - 0.166 * c3);
        vy += amp * (-0.425 * c1 + 0.125 * c2 - 0.111 * c3);
      }
      var nx = x + vx * dt, ny = y + vy * dt;
      age[i] += dt;
      if (age[i] > life[i]) { spawn(i); continue; }
      var wrapped = false;
      if (nx < 0) { nx += W; wrapped = true; } else if (nx >= W) { nx -= W; wrapped = true; }
      if (ny < 0) { ny += H; wrapped = true; } else if (ny >= H) { ny -= H; wrapped = true; }
      px[i] = nx; py[i] = ny;
      if (wrapped) continue;
      var lf = Math.min(1, age[i] / 0.6, (life[i] - age[i]) / 0.6);
      var al = (0.3 + 0.62 * Math.min(1, sp / 14)) * lf;
      if (ny < TOP || ny > BOT) al *= 0.45;
      var grey = cls[r] !== 0;
      if (grey) al *= 0.7;
      var lvl = Math.floor(al * 6); if (lvl > 5) lvl = 5; if (lvl < 0) lvl = 0;
      var arr = bk[(grey ? 6 : 0) + lvl];
      if (look === 'streaks') {
        var sx = nx - vx * 0.16, sy = ny - vy * 0.16;
        if (Math.abs(nx - sx) + Math.abs(ny - sy) < 1) { sx = nx - 0.01; sy = ny; }
        arr.push(sx, sy, nx, ny);
      } else {
        arr.push(x, y, nx, ny);
      }
    }
    ctx.lineCap = 'round';
    var bi, j, pts;
    if (look === 'fog') {
      ctx.globalCompositeOperation = 'lighter';
      for (bi = 0; bi < 12; bi++) {
        pts = bk[bi]; if (!pts.length) continue;
        var sprite = bi >= 6 ? spriteGrey : spriteIce;
        ctx.globalAlpha = ((bi % 6) + 0.5) / 6 * 0.13;
        for (j = 0; j < pts.length; j += 4) ctx.drawImage(sprite, pts[j + 2] - 17, pts[j + 3] - 17, 34, 34);
      }
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.lineWidth = 1;
      for (bi = 0; bi < 12; bi++) {
        pts = bk[bi]; if (!pts.length) continue;
        ctx.strokeStyle = 'rgba(' + (bi >= 6 ? GREY : ICE) + ',' + (((bi % 6) + 0.5) / 6 * 0.5).toFixed(3) + ')';
        ctx.beginPath();
        for (j = 0; j < pts.length; j += 4) { ctx.moveTo(pts[j], pts[j + 1]); ctx.lineTo(pts[j + 2], pts[j + 3]); }
        ctx.stroke();
      }
    } else {
      ctx.lineWidth = look === 'streaks' ? 1.7 : 1.3;
      for (bi = 0; bi < 12; bi++) {
        pts = bk[bi]; if (!pts.length) continue;
        ctx.strokeStyle = 'rgba(' + (bi >= 6 ? GREY : ICE) + ',' + (((bi % 6) + 0.5) / 6).toFixed(3) + ')';
        ctx.beginPath();
        for (j = 0; j < pts.length; j += 4) { ctx.moveTo(pts[j], pts[j + 1]); ctx.lineTo(pts[j + 2], pts[j + 3]); }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- controls ----------
  var sheet = document.getElementById('sheet');
  var settingsBtn = document.getElementById('settings-btn');
  var density = document.getElementById('density');
  var densityOut = document.getElementById('density-out');
  var swirl = document.getElementById('swirl');

  function syncControls() {
    Array.prototype.forEach.call(document.querySelectorAll('#seg-scen button'), function (b) { b.setAttribute('aria-pressed', String(+b.dataset.v === st.scen)); });
    Array.prototype.forEach.call(document.querySelectorAll('#seg-look button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === st.look)); });
    density.value = String(st.density);
    densityOut.textContent = Math.round(st.density * 100) + '%';
    swirl.checked = st.swirl;
  }
  function setScenario(i) {
    st.scen = i; t0 = performance.now();
    tickReadings(); renderOverlay(); syncControls(); save();
  }
  function openSheet(open) {
    sheet.hidden = !open;
    settingsBtn.setAttribute('aria-expanded', String(open));
    if (open) { var f = sheet.querySelector('[aria-pressed="true"]'); if (f) f.focus(); } else { settingsBtn.focus(); }
  }

  document.getElementById('scen-btn').addEventListener('click', function () { setScenario((st.scen + 1) % SC.length); });
  settingsBtn.addEventListener('click', function () { openSheet(sheet.hidden); });
  document.getElementById('close-btn').addEventListener('click', function () { openSheet(false); });
  sheet.addEventListener('keydown', function (e) { if (e.key === 'Escape') openSheet(false); });
  document.getElementById('seg-scen').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) setScenario(+b.dataset.v);
  });
  document.getElementById('seg-look').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.look = b.dataset.v; syncControls(); save();
  });
  density.addEventListener('input', function () { st.density = Math.round(parseFloat(density.value) * 10) / 10; syncControls(); save(); });
  swirl.addEventListener('change', function () { st.swirl = swirl.checked; save(); });

  // keep the screen awake while demoing, where the browser allows it
  var wakeLock = null;
  function requestWake() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {});
  }
  stage.addEventListener('pointerdown', requestWake);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') requestWake(); });

  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(stage);
  else window.addEventListener('resize', layout);

  tickReadings();
  syncControls();
  layout();
  setInterval(function () { tickReadings(); renderOverlay(); }, 1000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
